<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MENA Dashboard</title>
<style>body{font:15px/1.5 system-ui,sans-serif;margin:40px;color:#444}</style>
</head><body>
<p id="s">Loading dashboard&hellip;</p>
<script>
/* Loader stub. The dashboard shell is the repo-root index.html.
   This page pulls it in without navigating, so the URL stays /wmt/ or /wg/ and the
   dashboard's own routing picks the product up from the path. A <base href="../">
   is injected so assets/ and data/ resolve to the repo root.
   Do not edit the dashboard here. */
fetch('../index.html',{cache:'no-cache'})
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(t){ t=t.replace(/<head>/i,'<head><base href="../">');
    document.open(); document.write(t); document.close(); })
  .catch(function(e){
    document.getElementById('s').innerHTML =
      'Could not load the dashboard (' + e.message + '). ' +
      '<a href="../">Open the main dashboard</a>.';
  });
</script>
</body></html>
