<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MENA Dashboard</title>
<style>body{font:15px/1.5 system-ui,sans-serif;margin:40px;color:#444}</style>
</head><body>
<p id="s">Loading dashboard&hellip;</p>
<script>
/* Loader stub. The dashboard lives in ONE file at the repo root (../index.html).
   This page pulls it in without navigating, so the URL stays /wmt/ and the
   dashboard's own routing picks the product up from the path.
   Do not edit the dashboard here - edit /index.html only. */
fetch('../index.html',{cache:'no-cache'})
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(t){ document.open(); document.write(t); document.close(); })
  .catch(function(e){
    document.getElementById('s').innerHTML =
      'Could not load the dashboard (' + e.message + '). ' +
      '<a href="../">Open the main dashboard</a>.';
  });
</script>
</body></html>
